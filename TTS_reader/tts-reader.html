            aiConfig = {
                provider: aiProvider.value,
                apiUrl: aiApiUrl.value,
                apiKey: aiApiKey.value,
                model: aiModel.value,
                maxTokens: aiMaxTokens.value || '2048',
                temperature: aiTemperature.value || '0.7'
            };
            localStorage.setItem('tts-ai-config', JSON.stringify(aiConfig));
            updateAIStatus();
            showStatus('AI 配置已保存', 'success');
        }

        function updateAIStatus() {
            var hasKey = aiApiKey.value || aiConfig.apiKey;
            var hasUrl = aiApiUrl.value || aiConfig.apiUrl;
            var hasModel = aiModel.value || aiConfig.model;
            if (hasKey && hasUrl && hasModel) {
                aiStatus.textContent = 'API 已配置，将调用在线 AI';
                aiStatus.className = 'ai-status online';
            } else {
                aiStatus.textContent = '未配置 API，将使用本地分析';
                aiStatus.className = 'ai-status';
            }
        }

        // 监听表单输入变化，实时更新状态
        [aiProvider, aiApiUrl, aiApiKey, aiModel, aiMaxTokens, aiTemperature].forEach(function(el) {
            el.addEventListener('input', updateAIStatus);
            el.addEventListener('change', updateAIStatus);
        });

        function getPrompt(type) {
            var prompts = {
                deep: '请对以下文本进行深入剖析，从多个维度分析其结构、论点、逻辑和潜在含义：',
                oneline: '请用一句话总结以下文本的核心主旨：',
                core: '请提取以下文本的核心观点，用简洁的要点列出：',
                keywords: '请从以下文本中提取5-10个关键词，按重要性排序：'
            };
            return prompts[type] || '';
        }

        function getProviderUrl(provider) {
            var urls = {
                openai: 'https://api.openai.com/v1/chat/completions',
                anthropic: 'https://api.anthropic.com/v1/messages',
                deepseek: 'https://api.deepseek.com/v1/chat/completions',
                openrouter: 'https://openrouter.ai/api/v1/chat/completions',
                ollama: 'http://localhost:11434/api/chat',
                siliconflow: 'https://api.siliconflow.cn/v1/chat/completions',
                aliyun: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
                tencent: 'https://api.lkeap.cloud.tencent.com/v1/chat/completions'
            };
            return urls[provider] || urls.openai;
        }

        function getDefaultModelForProvider(provider) {
            var models = {
                openai: 'gpt-4o-mini',
                anthropic: 'claude-3-5-sonnet-20241022',
                deepseek: 'deepseek-chat',
                openrouter: 'openai/gpt-4o-mini',
                ollama: 'llama3',
                siliconflow: 'Qwen/Qwen2.5-72B-Instruct',
                aliyun: 'qwen-plus',
                tencent: 'hunyuan-lite'
            };
            return models[provider] || 'gpt-4o-mini';
        }

        function getApiDescription(provider) {
            var desc = {
                openai: 'OpenAI API Key 格式: sk-xxx...',
                anthropic: 'Anthropic API Key 格式: sk-ant-xxx...',
                deepseek: 'DeepSeek API Key 格式: sk-xxx...',
                openrouter: 'OpenRouter API Key',
                ollama: '本地Ollama无需API Key',
                siliconflow: '硅基流动 API Key',
                aliyun: '阿里云百炼 API Key',
                tencent: '腾讯云 API Key'
            };
            return desc[provider] || '';
        }

        function getProviderHeaders(provider) {
            var headers = { 'Content-Type': 'application/json' };
            if (aiConfig.apiKey) {
                if (provider === 'anthropic') headers['x-api-key'] = aiConfig.apiKey;
                else if (provider === 'openrouter') headers['HTTP-Referer'] = window.location.href;
                else headers['Authorization'] = 'Bearer ' + aiConfig.apiKey;
            }
            if (provider === 'anthropic') headers['anthropic-version'] = '2023-06-01';
            return headers;
        }

        function buildAPIPayload(type, text) {
            var provider = aiConfig.provider || 'openai';
            var systemMsg = '你是一个专业的文本分析助手，请用中文回答。';

            if (provider === 'anthropic') {
                return {
                    model: aiConfig.model || 'claude-3-sonnet-20240229',
                    max_tokens: parseInt(aiConfig.maxTokens) || 2048,
                    temperature: parseFloat(aiConfig.temperature) || 0.7,
                    system: systemMsg,
                    messages: [{ role: 'user', content: getPrompt(type) + '\n\n' + text.substring(0, 3000) }]
                };
            }
            if (provider === 'ollama') {
                return {
                    model: aiConfig.model || 'llama3',
                    messages: [
                        { role: 'system', content: systemMsg },
                        { role: 'user', content: getPrompt(type) + '\n\n' + text.substring(0, 3000) }
                    ],
                    stream: false
                };
            }
            return {
                model: aiConfig.model || 'gpt-4o-mini',
                max_tokens: parseInt(aiConfig.maxTokens) || 2048,
                temperature: parseFloat(aiConfig.temperature) || 0.7,
                messages: [
                    { role: 'system', content: systemMsg },
                    { role: 'user', content: getPrompt(type) + '\n\n' + text.substring(0, 3000) }
                ]
            };
        }

        function callAI(type, text) {
            var provider = aiConfig.provider || 'openai';
            var url = aiConfig.apiUrl || getProviderUrl(provider);
            var payload = buildAPIPayload(type, text);
            var headers = getProviderHeaders(provider);

            return fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(payload)
            }).then(function(response) {
                if (!response.ok) throw new Error('API 错误 (' + response.status + ')');
                return response.json();
            }).then(function(data) {
                if (provider === 'anthropic') return data.content[0].text;
                if (provider === 'ollama') return data.message.content;
                return data.choices[0].message.content;
            });
        }

        function generateAILocal(type, text) {
            var sentences = text.split(/[。！？；\n]/).filter(function(s) { return s.trim().length > 5; });
            var words = text.split(/[\s\u3000，,、：:；;（）()【】""''《》]/).filter(function(w) { return w.length > 1; });
            var wordFreq = {};
            words.forEach(function(w) { wordFreq[w] = (wordFreq[w] || 0) + 1; });
            var topWords = Object.entries(wordFreq).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 10);

            var result = '';
            if (type === 'deep') {
                result = '文本分析报告\n\n';
                result += '总字数：' + text.length + '\n';
                result += '句子数：' + sentences.length + '\n';
                result += '段落结构：约 ' + Math.ceil(sentences.length / 5) + ' 个意群\n\n';
                result += ' 高频词汇 TOP 10：\n';
                topWords.forEach(function(pair, i) { result += '  ' + (i + 1) + '. ' + pair[0] + '（' + pair[1] + '次）\n'; });
                result += '\n 分析建议：\n';
                result += '  - 文本长度 ' + (text.length > 2000 ? '较长' : '适中') + '，适合分段阅读\n';
                result += '  - 句子数量 ' + (sentences.length > 20 ? '较多' : '较少') + '，';
                result += sentences.length > 20 ? '信息密度较高\n' : '内容相对精炼\n';
                if (sentences.length > 0) {
                    result += '\n 首句预览：' + sentences[0].substring(0, 50) + '...\n';
                    result += ' 末句预览：' + sentences[sentences.length - 1].substring(0, 50) + '...\n';
                }
            } else if (type === 'oneline') {
                result = ' ' + (sentences[0] || '无法提取') + '\n\n';
                result += '(本地分析，配置 AI API 可获取更精准总结)';
            } else if (type === 'core') {
                result = ' 核心观点\n\n';
                var coreSentences = sentences.slice(0, Math.min(5, sentences.length));
                coreSentences.forEach(function(s, i) { result += '  ' + (i + 1) + '. ' + s.substring(0, 80) + '\n'; });
                result += '\n(配置 AI API 可获取更精准的核心观点提取)';
            } else if (type === 'keywords') {
                result = ' 关键词\n\n';
                topWords.forEach(function(pair, i) { result += '  ' + (i + 1) + '. ' + pair[0] + '\n'; });
                result += '\n(配置 AI API 可获取更精准的关键词提取)';
            }
            return result;
        }

        function getAICacheKey(historyId) {
            return 'tts-ai-cache-' + historyId;
        }

        function loadAICache(historyId) {
            if (!historyId) return null;
            try {
                var cache = JSON.parse(localStorage.getItem(getAICacheKey(historyId)) || 'null');
                // Invalidate old cache entries that don't have version or contain local analysis markers
                if (cache && (!cache._version || cache._version < 2)) return null;
                return cache;
            } catch (e) { return null; }
        }

        function saveAICache(historyId, type, content) {
            if (!historyId) return;
            var cache = loadAICache(historyId) || { _version: 2 };
            cache._version = 2;
            cache[type] = content;
            cache._updatedAt = Date.now();
            localStorage.setItem(getAICacheKey(historyId), JSON.stringify(cache));
        }

        function restoreAICache(historyId) {
            var cache = loadAICache(historyId);
            if (!cache) {
                aiOutput.style.display = 'none';
                aiOutput.textContent = '';
                document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
                return;
            }
            
            var typeMap = ['deep', 'oneline', 'core', 'keywords'];
            var btnMap = { deep: aiDeepBtn, oneline: aiOneLineBtn, core: aiCoreBtn, keywords: aiKeywordsBtn };
            var foundType = null;
            
            for (var i = 0; i < typeMap.length; i++) {
                if (cache[typeMap[i]]) { foundType = typeMap[i]; break; }
            }
            
            if (foundType && cache[foundType]) {
                aiOutput.style.display = 'block';
                aiOutput.textContent = cache[foundType];
                document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
                if (btnMap[foundType]) btnMap[foundType].classList.add('active');
            } else {
                aiOutput.style.display = 'none';
                aiOutput.textContent = '';
                document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
            }
        }

        function generateAI(type) {
            var text = filteredText || textInput.value.trim();
            if (!text) { showStatus('请先输入或朗读文本', 'error'); return; }

            // 检查缓存：有缓存直接显示，不调 API
            if (currentActiveHistoryId) {
                var cache = loadAICache(currentActiveHistoryId);
                if (cache && cache[type]) {
                    aiOutput.style.display = 'block';
                    aiOutput.textContent = cache[type];
                    document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
                    var btnMap = { deep: aiDeepBtn, oneline: aiOneLineBtn, core: aiCoreBtn, keywords: aiKeywordsBtn };
                    if (btnMap[type]) btnMap[type].classList.add('active');
                    return;
                }
            }

            // 检查 API 配置
            var currentApiKey = (aiApiKey.value || aiConfig.apiKey || '').trim();
            var currentApiUrl = (aiApiUrl.value || aiConfig.apiUrl || '').trim();
            var currentModel = (aiModel.value || aiConfig.model || '').trim();
            var currentProvider = aiProvider.value || aiConfig.provider || 'openai';

            if (!currentApiKey || !currentApiUrl || !currentModel) {
                showStatus('请先配置 AI API', 'error');
                return;
            }

            // 高亮按钮并显示加载状态
            document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
            var btnMap = { deep: aiDeepBtn, oneline: aiOneLineBtn, core: aiCoreBtn, keywords: aiKeywordsBtn };
            if (btnMap[type]) btnMap[type].classList.add('active');
            aiOutput.style.display = 'block';
            aiOutput.className = 'ai-output loading';
            aiOutput.textContent = '正在生成...';

            // 自动补全 URL
            if (!currentApiUrl.startsWith('http')) { currentApiUrl = 'https://' + currentApiUrl; }
            var providerDefaultUrl = getProviderUrl(currentProvider);
            if (!currentApiUrl.includes('/v1/') && !currentApiUrl.includes('/api/')) {
                var endpointPath = providerDefaultUrl.substring(providerDefaultUrl.indexOf('/v1/'));
                if (endpointPath) { currentApiUrl = currentApiUrl.replace(/\/+$/, '') + endpointPath; }
            }
            
            var tempConfig = {
                provider: currentProvider, apiUrl: currentApiUrl, apiKey: currentApiKey,
                model: currentModel, maxTokens: aiMaxTokens.value || aiConfig.maxTokens || '2048',
                temperature: aiTemperature.value || aiConfig.temperature || '0.7'
            };
            var originalConfig = JSON.parse(JSON.stringify(aiConfig));
            aiConfig = tempConfig;

            callAI(type, text).then(function(result) {
                aiConfig = originalConfig;
                aiOutput.className = 'ai-output';
                aiOutput.textContent = result;
                saveAICache(currentActiveHistoryId, type, result);
            }).catch(function(err) {
                aiConfig = originalConfig;
                aiOutput.className = 'ai-output';
                aiOutput.textContent = 'API 调用失败: ' + err.message;
            });
        }

        pasteHeader.addEventListener('click', togglePaste);

        playBtn.addEventListener('click', function() {
            if (synth.speaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showStatus('已暂停', 'info');
            } else if (isPaused) {
                synth.resume();
                isPaused = false;
                showStatus('继续朗读中...', 'success');
            } else {
                addHistory(textInput.value);
                if (errorOccurred || wasInterrupted) {
                    lastCharIndex = 0;
                    errorOccurred = false;
                    wasInterrupted = false;
                }
                if (isPasteExpanded) togglePaste();
                speakText(false);
            }
            updateButtons();
        });

        stopBtn.addEventListener('click', function() {
            synth.cancel();
            isReading = false;
            isPaused = false;
            errorOccurred = false;
            wasInterrupted = false;
            saveProgress();
            showStatus('已停止', 'info');
            readingArea.classList.remove('active');
            clearHighlights();
            updateButtons();
        });

        restartBtn.addEventListener('click', function() {
            lastCharIndex = 0;
            errorOccurred = false;
            wasInterrupted = false;
            speakText(false);
        });

        skipBackBtn.addEventListener('click', function() { jumpSentence(-1); });
        skipForwardBtn.addEventListener('click', function() { jumpSentence(1); });

        pasteBtn.addEventListener('click', function() {
            navigator.clipboard.readText().then(function(t) {
                textInput.value = t;
                updateCharCount();
                showStatus('已从剪贴板粘贴', 'success');
            }).catch(function() {
                showStatus('无法访问剪贴板，请手动粘贴', 'error');
            });
        });

        readingArea.addEventListener('click', function(e) {
            const target = e.target;
            if (target.classList.contains('sentence')) {
                const start = parseInt(target.dataset.start);
                if (!isNaN(start)) {
                    lastCharIndex = start;
                    synth.cancel();
                    let textToSpeak = filteredText.substring(lastCharIndex);
                    if (!textToSpeak.trim()) {
                        showStatus('已经朗读到文末', 'success');
                        return;
                    }
                    showStatus('从该位置开始朗读', 'info');
                    startSpeaking(textToSpeak, lastCharIndex);
                }
            }
        });

        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            lastCharIndex = Math.floor(pct * filteredText.length);
            synth.cancel();
            let textToSpeak = filteredText.substring(lastCharIndex);
            if (textToSpeak.trim()) startSpeaking(textToSpeak, lastCharIndex);
            showStatus('已跳转到 ' + Math.round(pct * 100) + '%', 'info');
        });

        voiceSelect.addEventListener('change', function() { updateVoiceInfo(); saveSettings(); });
        rateRange.addEventListener('input', function() { rateValue.textContent = rateRange.value; saveSettings(); });
        textInput.addEventListener('input', updateCharCount);
        markdownFilter.addEventListener('change', saveSettings);
        historyClearBtn.addEventListener('click', clearHistory);

        var isRecycleBinVisible = false;
        recycleBinBtn.addEventListener('click', function() {
            isRecycleBinVisible = !isRecycleBinVisible;
            recyclePanel.classList.toggle('visible', isRecycleBinVisible);
            recycleBinBtn.textContent = isRecycleBinVisible ? '🗑️ 关闭回收站' : '️ 回收站';
            recycleBinBtn.appendChild(recycleBadge);
            if (isRecycleBinVisible) renderRecycleBin();
        });

        newRecordBtn.addEventListener('click', function() {
            synth.cancel();
            isReading = false; isPaused = false; errorOccurred = false; wasInterrupted = false;
            currentActiveHistoryId = null;
            textInput.value = '';
            filteredText = '';
            lastCharIndex = 0;
            updateCharCount();
            readingArea.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 200px; font-size: 16px;">开始朗读后，文本将显示在这里</p>';
            readingArea.classList.remove('active');
            clearHighlights();
            progressBarFill.style.width = '0%';
            progressPct.textContent = '0%';
            progressCount.textContent = '0 / 0';
            updateButtons();
            aiOutput.textContent = '';
            aiOutput.className = 'ai-output';
            document.querySelectorAll('.ai-btn').forEach(function(b) { b.classList.remove('active'); });
            textInput.focus();
        });

        document.querySelectorAll('.theme-btn').forEach(function(btn) {
            btn.addEventListener('click', function() { applyTheme(btn.dataset.theme); });
        });

        minimalBtn.addEventListener('click', function() { setMinimal(true); });
        minimalExitBtn.addEventListener('click', function() { setMinimal(false); });
        minimalPlayBtn.addEventListener('click', function() {
            if (errorOccurred || wasInterrupted) { lastCharIndex = 0; errorOccurred = false; wasInterrupted = false; }
            speakText(synth.speaking ? true : false);
        });
        minimalPauseBtn.addEventListener('click', function() {
            if (synth.speaking && !isPaused) { synth.pause(); isPaused = true; }
            updateButtons();
        });
        minimalStopBtn.addEventListener('click', function() {
            synth.cancel(); isReading = false; isPaused = false; errorOccurred = false; wasInterrupted = false;
            showStatus('已停止', 'info'); updateButtons();
        });

        aiDeepBtn.addEventListener('click', function() { generateAI('deep'); });
        aiOneLineBtn.addEventListener('click', function() { generateAI('oneline'); });
        aiCoreBtn.addEventListener('click', function() { generateAI('core'); });
        aiKeywordsBtn.addEventListener('click', function() { generateAI('keywords'); });

        aiConfigToggle.addEventListener('click', function() {
            isConfigVisible = !isConfigVisible;
            aiConfigPanel.classList.toggle('visible', isConfigVisible);
            aiConfigToggle.textContent = isConfigVisible ? '⚙️ 收起 AI 配置' : '⚙️ 配置 AI 模型 API';
        });

        // 当选择不同提供商时，自动填充对应的API地址
        aiProvider.addEventListener('change', function() {
            var provider = aiProvider.value;
            var defaultUrl = getProviderUrl(provider);
            if (!aiApiUrl.value || aiApiUrl.value === getProviderUrl(aiConfig.provider || 'openai')) {
                aiApiUrl.value = defaultUrl;
            }
            // 自动设置默认模型
            var defaultModels = {
                openai: 'gpt-4o-mini',
                anthropic: 'claude-3-5-sonnet-20241022',
                deepseek: 'deepseek-chat',
                openrouter: 'openai/gpt-4o-mini',
                ollama: 'llama3',
                siliconflow: 'Qwen/Qwen2.5-72B-Instruct',
                aliyun: 'qwen-plus',
                tencent: 'hunyuan-lite'
            };
            if (!aiModel.value || defaultModels[aiConfig.provider || ''] === aiModel.value) {
                aiModel.value = defaultModels[provider] || 'gpt-4o-mini';
            }
            updateAIStatus();
        });

        aiConfigSave.addEventListener('click', saveAIConfigFn);

        var aiConfigTest = document.getElementById('aiConfigTest');
        aiConfigTest.addEventListener('click', function() {
            var currentProvider = aiProvider.value || 'openai';
            var currentApiUrl = (aiApiUrl.value || '').trim();
            var currentApiKey = (aiApiKey.value || '').trim();
            var currentModel = (aiModel.value || '').trim();

            if (!currentApiKey || !currentApiUrl || !currentModel) {
                aiStatus.textContent = '请填写完整的 API 配置信息';
                aiStatus.className = 'ai-status';
                aiStatus.style.color = 'var(--status-error-color)';
                return;
            }

            aiConfigTest.textContent = '测试中...';
            aiConfigTest.disabled = true;

            // 自动补全 URL
            if (!currentApiUrl.startsWith('http')) {
                currentApiUrl = 'https://' + currentApiUrl;
            }

            var testPayload;
            if (currentProvider === 'anthropic') {
                testPayload = {
                    model: currentModel,
                    max_tokens: 10,
                    messages: [{ role: 'user', content: 'Hi' }]
                };
            } else if (currentProvider === 'ollama') {
                testPayload = {
                    model: currentModel,
                    messages: [{ role: 'user', content: 'Hi' }],
                    stream: false
                };
            } else {
                testPayload = {
                    model: currentModel,
                    max_tokens: 10,
                    messages: [
                        { role: 'system', content: 'You are a helpful assistant.' },
                        { role: 'user', content: 'Hi' }
                    ]
                };
            }

            var testHeaders = { 'Content-Type': 'application/json' };
            if (currentProvider === 'anthropic') {
                testHeaders['x-api-key'] = currentApiKey;
                testHeaders['anthropic-version'] = '2023-06-01';
            } else if (currentProvider === 'openrouter') {
                testHeaders['HTTP-Referer'] = window.location.href;
                testHeaders['Authorization'] = 'Bearer ' + currentApiKey;
            } else {
                testHeaders['Authorization'] = 'Bearer ' + currentApiKey;
            }

            fetch(currentApiUrl, {
                method: 'POST',
                headers: testHeaders,
                body: JSON.stringify(testPayload)
            }).then(function(response) {
                if (!response.ok) {
                    if (response.status === 401) throw new Error('API Key 无效 (401)');
                    if (response.status === 404) throw new Error('API 地址错误 (404)，请检查 URL');
                    if (response.status === 429) throw new Error('请求太频繁 (429)');
                    throw new Error('状态码: ' + response.status);
                }
                return response.json();
            }).then(function(data) {
                aiStatus.textContent = '连接成功！API 配置有效';
                aiStatus.className = 'ai-status online';
                aiStatus.style.color = '';
                aiConfigTest.textContent = '测试连接';
                aiConfigTest.disabled = false;
            }).catch(function(err) {
                aiStatus.textContent = '测试失败: ' + err.message;
                aiStatus.className = 'ai-status';
                aiStatus.style.color = 'var(--status-error-color)';
                aiConfigTest.textContent = '测试连接';
                aiConfigTest.disabled = false;
            });
        });

        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
        applyTheme(currentTheme);
        renderHistory();
        loadAIConfig();
        window.addEventListener('beforeunload', saveProgress);
        setInterval(saveProgress, 5000);

        const lastText = localStorage.getItem('tts-last-text');
        const lastFiltered = localStorage.getItem('tts-last-filtered');
        const lastPos = parseInt(localStorage.getItem('tts-last-pos') || '0');
        const lastTime = parseInt(localStorage.getItem('tts-last-time') || '0');
        if (lastText && lastFiltered && lastPos > 0 && lastTime && Date.now() - lastTime < 7 * 24 * 60 * 60 * 1000) {
            textInput.value = lastText;
            filteredText = lastFiltered;
            lastCharIndex = lastPos;
            updateCharCount();
            prepareReadingArea();
            highlightSentenceByIndex(lastPos);
            showStatus('已恢复上次阅读进度（' + formatTimeAgo(Date.now() - lastTime) + '前）', 'info');
        }

        document.addEventListener('keydown', function(e) {
            const tag = e.target.tagName;
            if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
            if (e.key === ' ') {
                e.preventDefault();
                playBtn.click();
            }
            if (e.key === 'ArrowLeft') { e.preventDefault(); jumpSentence(-1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); jumpSentence(1); }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                rateRange.value = Math.min(3, parseFloat(rateRange.value) + 0.1).toFixed(1);
                rateValue.textContent = rateRange.value;
                saveSettings();
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                rateRange.value = Math.max(0.3, parseFloat(rateRange.value) - 0.1).toFixed(1);
                rateValue.textContent = rateRange.value;
                saveSettings();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                addHistory(textInput.value);
                if (errorOccurred || wasInterrupted) { lastCharIndex = 0; errorOccurred = false; wasInterrupted = false; }
                speakText(false);
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                synth.cancel(); isReading = false; isPaused = false; errorOccurred = false; wasInterrupted = false;
                saveProgress(); readingArea.classList.remove('active'); clearHighlights(); updateButtons();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); playBtn.click(); }
            if (e.key === 'Escape') { if (document.body.classList.contains('body-minimal')) setMinimal(false); }
        });
    </script>
</body>
</html>
